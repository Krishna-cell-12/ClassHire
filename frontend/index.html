<!doctype html>
<html lang="en" data-theme="dark" data-depth="on" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0b12" />
    <meta name="description" content="Origin ERP — Integrated Student Management System. PS-6 SIH 2025. Features Risk Radar, NL Query Assistant, attendance tracking, fee management, and exam results." />
    <title>Origin ERP — Student Management System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply the saved theme / 3D preference before first paint so the app
      // never flashes the wrong surface on reload.
      (function () {
        try {
          var root = document.documentElement
          var theme = localStorage.getItem('origin.theme')
          if (theme !== 'light' && theme !== 'dark') theme = 'dark'
          root.dataset.theme = theme
          root.classList.toggle('dark', theme === 'dark')
          root.style.colorScheme = theme

          var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches
          var depth = localStorage.getItem('origin.depth') !== 'off' && !reduced
          root.dataset.depth = depth ? 'on' : 'off'

          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0a0b12' : '#f1f4f9')
        } catch (e) {
          /* private browsing — fall back to the markup defaults */
        }
      })()
    </script>
    <style>
      /* Paint the page background immediately, before the CSS bundle lands. */
      html { background: #0a0b12; }
      html[data-theme='light'] { background: #f1f4f9; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
